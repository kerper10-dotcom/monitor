name: Njuskalo Pace

# GitHubov schedule ("svakih 5 min") realno krene par puta dnevno.
# Ovaj job ne otvara Njuskalo. Šalje workflow_dispatch na svježi runner.
# Ako runda vidi CAPTCHA-u, staje. Ne pali još 11 blokiranih rundi.
# Satni cron je watchdog: kad je IP čist, lanac pokrije sve oglase; kad nije, jedna runda.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: njuskalo-pace
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pace dispatches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pace.sh
