name: Njuskalo Saved Ads

# Jedna runda = ~20 najstarijih detaljnih URL-ova na svježem runneru.
# Ritam drži monitor-pace.yml (workflow_dispatch). Nema vlastitog schedulea:
# 5-minutni cron se nije držao, a zajedno s pacerom bi duplirao scrape.
on:
  workflow_dispatch:

concurrency:
  group: njuskalo-saved
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  saved:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run saved-ads check
        env:
          TZ: Europe/Zagreb
          MONITOR_MODE: saved
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python monitor.py

      - name: Commit DB and saved_ads changes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/commit_state.sh
