name: Njuskalo Saved Ads

# GitHub guta česte cronove (10,30,50 nikad nisu palili na vrijeme).
# Jedan schedule svakih 6 h, 8 odvojenih jobova (~28 oglasa, svaki svoj IP).
# 20:20 UTC = 22:20 Zagreb ljeti, 21:20 zimi. Isto za 02, 08, 14 UTC.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: njuskalo-saved
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  saved:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slice: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run saved-ads slice
        env:
          TZ: Europe/Zagreb
          MONITOR_MODE: saved
          SAVED_SLICE: ${{ matrix.slice }}
          SAVED_SLICES: "8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit DB and saved_ads changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase --autostash origin main
          git add njuskalo.db saved_ads.json
          if ! git diff --staged --quiet; then
            git commit -m "Update njuskalo.db and saved_ads.json [skip ci]"
            git push
          else
            echo "No DB/saved_ads changes to commit"
          fi
