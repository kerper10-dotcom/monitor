name: Njuskalo Saved Ads

# Odvojeno od novih oglasa. Svakih 5 min ~20 URL-ova → svi oglasi jednom na sat.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: njuskalo-saved
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  saved:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run saved-ads check
        env:
          TZ: Europe/Zagreb
          MONITOR_MODE: saved
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit DB and saved_ads changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase --autostash origin main
          git add njuskalo.db saved_ads.json
          if ! git diff --staged --quiet; then
            git commit -m "Update njuskalo.db and saved_ads.json [skip ci]"
            git push
          else
            echo "No DB/saved_ads changes to commit"
          fi
