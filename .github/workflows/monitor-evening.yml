name: Njuskalo Evening Full Check

# Full pass svih spremljenih (uklj. gone). Forsira SAVED_ADS_MODE=all.
# Cron u 21:05 i 22:05 UTC pokriva 23:05 CEST / CET; job se izvrsi samo
# kad je u Zagrebu sat 23 (jednom dnevno).
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
on:
  schedule:
    - cron: "5 21 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:

concurrency:
  group: njuskalo-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor-evening:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Only run at 23:xx Europe/Zagreb
        id: when
        run: |
          H=$(TZ=Europe/Zagreb date +%H)
          echo "Zagreb hour=$H"
          if [ "$H" = "23" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skip — not 23:xx Zagreb"
          fi

      - name: Checkout repo
        if: steps.when.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.when.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.when.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run full saved-ads check
        if: steps.when.outputs.run == 'true'
        env:
          TZ: Europe/Zagreb
          SAVED_ADS_MODE: all
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit DB and saved_ads changes
        if: steps.when.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add njuskalo.db saved_ads.json
          if ! git diff --staged --quiet; then
            git commit -m "Update njuskalo.db and saved_ads.json [skip ci]"
            git push
          else
            echo "No DB/saved_ads changes to commit"
          fi
